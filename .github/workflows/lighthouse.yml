name: Lighthouse mobile reports
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy to GitHub Pages"]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: lighthouse-production
  cancel-in-progress: true
jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Audit production pages on simulated mobile
        run: |
          mkdir -p reports
          for page in home france japan spain usa turkey italy mexico uk; do
            url="https://gowhereandwhen.com/"
            if [ "$page" != home ]; then url="https://gowhereandwhen.com/country/$page/"; fi
            npx --yes lighthouse@12.8.2 "$url" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output=html --output-path="reports/$page" --quiet
          done
      - name: Save audit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-mobile
          path: reports/
          retention-days: 7
